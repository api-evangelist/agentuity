description: >-
  Agentuity provides a first-class webhook surface. Inbound webhooks route external events
  to agents/handlers, and outbound webhook destinations deliver platform events to your
  endpoints with receipts, delivery tracking, and analytics. Related event-routing surfaces
  include Message Queues, Durable Streams, Schedules (cron), and Workflows.
capabilities:
- Manage webhook endpoints and destinations
- Delivery receipts and delivery tracking
- Webhook analytics
- Inbound webhook handlers as agent invocation routes (HTTP, cron, webhooks)
