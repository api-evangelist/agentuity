aid: agentuity
name: Agentuity
description: >-
  Agentuity is a full-stack cloud platform for building, deploying, and operating AI
  agents and the framework apps around them. Developers keep their existing framework
  (Next.js, Hono, React Router, SvelteKit, Nuxt, Astro, Vite React, TanStack Start) and
  attach Agentuity service clients for key-value, vector, object, and Postgres storage,
  durable streams, queues, webhooks, email, and cron schedules, plus sandboxes (isolated
  Linux containers), an AI Gateway that routes to OpenAI/Anthropic/Groq/Google, and
  OpenTelemetry observability. The agentuity CLI scaffolds projects, runs local
  development with environment wiring, and deploys to managed cloud, private cloud,
  on-prem, multi-cloud, or edge via the Gravity Network. A documented REST API,
  first-party JavaScript/TypeScript, Python, and Go SDKs, published Agent Skills, and
  Claude Code / OpenCode plugins round out the developer surface.
